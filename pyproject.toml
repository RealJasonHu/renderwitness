[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "renderwitness"
version = "0.2.0"
description = "Evidence-first VLM review for semantic visual regressions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Zhexun Hu", email = "huzhexun1@gmail.com" },
]
keywords = [
  "vlm",
  "visual-regression",
  "computer-vision",
  "ui-testing",
  "podman",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
capture = ["playwright>=1.51,<2"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/RealJasonHu/renderwitness"
Issues = "https://github.com/RealJasonHu/renderwitness/issues"

[project.scripts]
renderwitness = "renderwitness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renderwitness"]

[tool.hatch.build.targets.wheel.force-include]
"examples/baseline.png" = "renderwitness/assets/baseline.png"
"examples/candidate.png" = "renderwitness/assets/candidate.png"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["renderwitness"]

[tool.coverage.report]
show_missing = true
skip_covered = true
