    <g transform="translate(24 62)">
      <text x="0" y="0" fill="#8fa9b9" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="700" letter-spacing="1.5">BASELINE</text>
      <rect y="13" width="302" height="170" rx="9" fill="#eef3f6"/>
      <rect x="18" y="31" width="66" height="134" rx="5" fill="#172b36"/>
