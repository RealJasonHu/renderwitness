    <rect x="1" y="1" width="1062" height="42" rx="17" fill="#12232f"/>
    <circle cx="23" cy="22" r="5" fill="#ff6b6b"/>
    <circle cx="41" cy="22" r="5" fill="#f7c65d"/>
    <circle cx="59" cy="22" r="5" fill="#53e3a4"/>
