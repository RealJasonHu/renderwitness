      <rect x="326" y="13" width="302" height="170" rx="9" fill="#eef3f6"/>
      <rect x="344" y="31" width="66" height="134" rx="5" fill="#172b36"/>
      <rect x="426" y="34" width="170" height="14" rx="4" fill="#b9c9d0"/>
      <rect x="426" y="62" width="84" height="67" rx="6" fill="#fff" stroke="#cdd9de"/>
      <rect x="519" y="62" width="84" height="67" rx="6" fill="#fff" stroke="#cdd9de"/>
      <rect x="426" y="142" width="106" height="22" rx="6" fill="#217d71"/>
      <text x="439" y="157" fill="#fff" font-family="Inter, ui-sans-serif, system-ui" font-size="9">Deploy cont…</text>
      <rect x="420" y="136" width="119" height="34" rx="5" fill="none" stroke="#ffbd5a" stroke-width="3"/>
      <rect x="338" y="25" width="78" height="46" rx="5" fill="none" stroke="#ff6b7e" stroke-width="3"/>
    </g>

    <g transform="translate(676 63)">
      <text x="0" y="0" fill="#8fa9b9" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="700" letter-spacing="1.5">VLM FINDINGS</text>
      <g transform="translate(0 16)">
        <rect width="338" height="67" rx="9" fill="#201a18" stroke="#6f4d2c"/>
        <rect x="14" y="13" width="51" height="18" rx="9" fill="#72451f"/>
        <text x="25" y="26" fill="#ffd595" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">MAJOR</text>
        <text x="77" y="27" fill="#f3f8fb" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="700">Localized CTA is clipped</text>
        <text x="14" y="50" fill="#aabcc6" font-family="Inter, ui-sans-serif, system-ui" font-size="10">Evidence 02 · confidence 0.94</text>
      </g>
      <g transform="translate(0 92)">
        <rect width="338" height="67" rx="9" fill="#20171d" stroke="#704050"/>
        <rect x="14" y="13" width="57" height="18" rx="9" fill="#762b43"/>
        <text x="24" y="26" fill="#ffb2c0" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">CRITICAL</text>
