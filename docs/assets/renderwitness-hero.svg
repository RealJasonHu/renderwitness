<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RenderWitness visual regression report</title>
  <desc id="desc">A dark interface showing a baseline and candidate screenshot comparison, highlighted evidence regions, and semantic VLM findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0b1d2a"/>
      <stop offset="1" stop-color="#102e35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53e3c2"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="-40" r="290" fill="#1e665d" opacity=".18"/>
  <circle cx="80" cy="650" r="270" fill="#254b84" opacity=".2"/>

  <g transform="translate(68 58)">
    <path d="M29 0 54 14v29L29 58 4 43V14Z" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M15 29c8-12 20-12 28 0-8 12-20 12-28 0Z" fill="none" stroke="#d9fff7" stroke-width="3"/>
    <circle cx="29" cy="29" r="5" fill="#53e3c2"/>
    <text x="76" y="27" fill="#f2fbff" font-family="Inter, ui-sans-serif, system-ui" font-size="26" font-weight="700" letter-spacing=".5">RenderWitness</text>
    <text x="76" y="50" fill="#8aa5b5" font-family="Inter, ui-sans-serif, system-ui" font-size="14" letter-spacing="1.3">SEMANTIC VISUAL REGRESSION REVIEW</text>
  </g>

  <text x="68" y="168" fill="#f4fbff" font-family="Inter, ui-sans-serif, system-ui" font-size="45" font-weight="740">Pixels changed.</text>
  <text x="68" y="218" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui" font-size="45" font-weight="740">Did the experience break?</text>
  <text x="70" y="258" fill="#9db2bf" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Deterministic regions + grounded VLM findings + portable evidence.</text>

  <g transform="translate(68 304)" filter="url(#shadow)">
