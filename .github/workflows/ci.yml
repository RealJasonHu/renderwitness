name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=renderwitness --cov-report=term-missing --cov-fail-under=80
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        run: renderwitness demo --output reports/ci-demo
      - if: matrix.python-version == '3.12'
        name: Validate documented suite outcomes
        run: |
          python - <<'PY'
          from renderwitness import run_suite
          result = run_suite("examples/suite.json", "reports/ci-suite")
          assert [case.status for case in result.cases] == ["passed", "failed", "passed"]
          assert result.exit_code == 1
          PY
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: renderwitness-demo-report
          path: reports/ci-*

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,capture]'
      - run: python -m playwright install --with-deps chromium
      - name: Verify capture and standalone report interactions
        run: pytest tests/test_capture.py tests/test_report_browser.py
        env:
          RENDERWITNESS_BROWSER_TESTS: "1"
      - run: python scripts/run_browser_demo.py --output reports/browser-demo
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: renderwitness-browser-review
          path: reports/browser-demo
