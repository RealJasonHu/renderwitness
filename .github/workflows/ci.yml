name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=renderwitness --cov-report=term-missing --cov-fail-under=80
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        run: renderwitness demo --output reports/ci-demo
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: renderwitness-demo-report
          path: reports/ci-demo
